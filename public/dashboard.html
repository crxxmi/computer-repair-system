<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | REPAIR HUB</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #070d18;
      color: #e5eefc;
      font-family: Arial, sans-serif;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: #0e1b2e;
      padding: 28px 20px;
      border-right: 1px solid #1e3552;
    }

    .brand {
      color: #38bdf8;
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .sidebar a,
    .sidebar button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #cbd5e1;
      text-align: left;
      text-decoration: none;
      font-size: 15px;
      cursor: pointer;
    }

    .sidebar a.active,
    .sidebar a:hover,
    .sidebar button:hover {
      background: #16365a;
      color: #38bdf8;
    }

    .content {
      flex: 1;
      padding: 35px;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 35px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 27px;
    }

    #userInfo {
      color: #38bdf8;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 18px;
    }

    .stat-card {
      background: #0e1b2e;
      border: 1px solid #1e3552;
      border-radius: 14px;
      padding: 24px;
    }

    .stat-card p {
      color: #94a3b8;
      margin: 0 0 15px;
    }

    .stat-card h2 {
      margin: 0;
      color: #38bdf8;
      font-size: 32px;
    }

    .welcome {
      margin-top: 30px;
      padding: 25px;
      background: #0e1b2e;
      border: 1px solid #1e3552;
      border-radius: 14px;
    }

    .welcome h2 {
      color: #38bdf8;
    }

    @media (max-width: 800px) {
      .layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }

      .content {
        padding: 20px;
      }
    }

    @media (max-width: 450px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="layout">

    <aside class="sidebar">
      <div class="brand">REPAIR HUB</div>

      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="request.html">แจ้งซ่อม</a>
      <a href="repairs.html">รายการแจ้งซ่อม</a>

      <button id="logoutButton">ออกจากระบบ</button>
    </aside>

    <main class="content">

      <header class="topbar">
        <h1>Dashboard สรุปงานซ่อม</h1>
        <div id="userSection">
          <span id="userInfo"></span>
        </div>
      </header>

      <section class="stats">

        <div class="stat-card">
          <p>งานซ่อมทั้งหมด</p>
          <h2 id="totalCount">0</h2>
        </div>

        <div class="stat-card">
          <p>รอดำเนินการ</p>
          <h2 id="pendingCount">0</h2>
        </div>

        <div class="stat-card">
          <p>กำลังซ่อม</p>
          <h2 id="progressCount">0</h2>
        </div>

        <div class="stat-card">
          <p>ซ่อมเสร็จแล้ว</p>
          <h2 id="completedCount">0</h2>
        </div>

      </section>

      <section class="welcome">
        <h2>ยินดีต้อนรับสู่ REPAIR HUB</h2>
        <p>ระบบจองและติดตามงานซ่อมคอมพิวเตอร์</p>
        <p>สามารถตรวจสอบภาพรวมสถานะงานซ่อมได้จาก Dashboard นี้</p>
      </section>

      <p id="message"></p>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
