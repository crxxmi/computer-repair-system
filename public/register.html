<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก | REPAIR HUB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-card">
      <h1>REPAIR HUB</h1>
      <p>ระบบจองและติดตามงานซ่อมคอมพิวเตอร์</p>

      <h2>สมัครสมาชิก</h2>

      <form id="registerForm">
        <label for="registerName">ชื่อ-นามสกุล</label>
        <input
          type="text"
          id="registerName"
          required
          maxlength="100"
          placeholder="กรอกชื่อ-นามสกุล"
        >

        <label for="registerEmail">อีเมล</label>
        <input
          type="email"
          id="registerEmail"
          required
          placeholder="กรอกอีเมล"
        >

        <label for="registerPassword">รหัสผ่าน (อย่างน้อย 8 ตัวอักษร)</label>
        <input
          type="password"
          id="registerPassword"
          minlength="8"
          required
          placeholder="กรอกรหัสผ่าน"
        >

        <button type="submit">สมัครสมาชิก</button>
        <p id="authMessage"></p>
      </form>

      <p>มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
